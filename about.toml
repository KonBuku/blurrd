# cargo-about configuration, used by scripts/licenses.mjs with
# cargo-about 0.9.2 to collect the licence texts of every crate blurrd
# ships (the desktop app and the CLI) for THIRD-PARTY-NOTICES.md and the
# app's open-source licences view.
# https://embarkstudios.github.io/cargo-about/

# blurrd ships for Windows x64 only (as in deny.toml).
targets = ["x86_64-pc-windows-msvc"]
# Build scripts, proc macros used only at build time and dev-dependencies
# are not part of the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace crates (publish = false) are blurrd itself.
private = { ignore = true }
# Keep in sync with the allow list in deny.toml.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # ffmpeg-the-third and ffmpeg-sys-the-third only (see deny.toml).
  "WTFPL",
  # jpeg-encoder only: "(MIT OR Apache-2.0) AND IJG" (see deny.toml).
  "IJG",
]
