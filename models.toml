# OCR models of blurrd's verification. They are not committed: `cargo
# xtask fetch-models` downloads every bundled file into models/
# (gitignored) and checks its size and SHA-256; `--candidates` also fetches
# the benchmark candidates into models/candidates/. The installer and the
# CLI archive bundle the files marked `bundled`; blurrd never downloads
# anything at run time. blurrd-ocr pins the same SHA-256 values and checks
# them before the first OCR run. See docs/development.md ("ONNX Runtime and
# OCR models").
#
# Choice (benchmark in M16, `cargo nextest run -p blurrd-ocr --release
# --run-ignored all bench_`): PP-OCRv5 mobile stays bundled. On synthetic
# HUD names (capitals 11 px) it reads Latin names as well as PP-OCRv6
# small (97-100 % exact per length), Vietnamese names far better (90 %
# against 7 %) and finds more names in a kill-feed-sized zone (97.3 %
# against 86.9 %). Names in scripts the bundled model does not read are
# reported as unverifiable.
#
# Exact reads per script on tight crops (120 names each, DirectML):
#
#   recogniser       Cyrl Hangul HangulCommon Japanese Kana Thai Arab Deva
#   v5 mobile (bndl)   0     0         0         42     92    0    0    0
#   v6 small           0     0         0         38     89    0    0    0
#   v5 latin           0     0         0          0      0    0    0    0
#   v5 korean          0     0       100          0      0    0    0    0
#   v5 cyrillic       99     0         0          0      0    0    0    0
#   v5 arabic          0     0         0          0      0    0   82    0
#   v5 thai            0     0         0          0      0   25    0    0
#   v5 devanagari      0     0         0          0      0    0    0   17
#
# "Hangul" and "Japanese" draw uniformly from every precomposed syllable
# and from rare kanji; recognisers trained on real text read such
# out-of-vocabulary characters as a similar frequent one (the Korean
# model reads U+C50F as U+C313), so "HangulCommon" (frequent name
# syllables) and "Kana" measure real names. Thai, Arabic and Devanagari
# are drawn without text shaping, so their rates are lower bounds. Every
# per-script recogniser reads its own script and Latin only and would
# need a script router (backlog); until then Korean names, kanji names and
# every script other than Latin, Vietnamese and kana are unverifiable.

# All `path` values are relative to this URL (the tag of [conversion]).
base_url = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.10.0"

# Every file below comes from one conversion: the PaddleOCR 3 inference
# models (PaddlePaddle, Apache-2.0) converted to ONNX with paddle2onnx by
# the RapidOCR project and published in its ModelScope repository at a
# fixed tag.
[conversion]
by = "RapidAI (RapidOCR project)"
repository = "https://www.modelscope.cn/models/RapidAI/RapidOCR"
revision = "v3.10.0"
tool = "paddle2onnx"
license = "Apache-2.0"
upstream = "PaddleOCR 3 PP-OCRv5 and PP-OCRv6 inference models by PaddlePaddle, Apache-2.0"

