[package]
name = "blurrd-app"
description = "The blurrd desktop app: Tauri shell around the blurrd engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "blurrd_app"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
blurrd-blur = { workspace = true }
blurrd-core = { workspace = true }
blurrd-engine = { workspace = true }
blurrd-video = { workspace = true }
# Exact patches and leak crops of the blurrd:// scheme.
jpeg-encoder = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The asset protocol serves the opened videos to the preview player.
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-window-state = { workspace = true }
# `log`: the engine's tracing events reach the log plugin's files.
tracing = { workspace = true, features = ["log"] }
# v7 job ids, v4 for the media server's random token.
uuid = { workspace = true, features = ["v4", "v7"] }

[dev-dependencies]
# Writes the lossless synthetic clip of the Exact fidelity test.
ffmpeg-the-third = { workspace = true }

[lints]
workspace = true
