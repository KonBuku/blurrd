[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/KonBuku/blurrd"
homepage = "https://github.com/KonBuku/blurrd"
authors = ["Konrad <wagnerkonrad09@gmail.com>"]
publish = false

# Shared dependency versions, pinned exactly (see the stack in the
# architecture plan). A dependency is added here by the commit that first
# uses it; crates inherit it with `dep.workspace = true`.
[workspace.dependencies]
# Text rendering of the synthetic HUD fixtures (blurrd-testkit).
ab_glyph = "=0.2.32"
anyhow = "=1.0.104"
blurrd-blur = { path = "crates/blurrd-blur" }
blurrd-core = { path = "crates/blurrd-core" }
blurrd-testkit = { path = "crates/blurrd-testkit" }
blurrd-video = { path = "crates/blurrd-video" }
clap = { version = "=4.6.7", features = ["derive"] }
crossbeam-channel = "=0.5.17"
# Ctrl+C handling in the CLI (cancels the job and removes partial output).
ctrlc = "=3.5.2"
# FFmpeg 9.0 bindings, linked against the pinned build in third_party/ffmpeg
# (FFMPEG_DIR). Only the libraries blurrd uses are enabled.
ffmpeg-the-third = { version = "=6.0.0", default-features = false, features = [
  "codec",
  "format",
  "software-resampling",
] }
schemars = { version = "=1.2.2", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.21"
toml = "=1.1.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
  "ansi",
  "std",
] }
# `no-serde-warnings`: types with a custom serde representation (`try_from`,
# `into`, `transparent`) state their TypeScript shape with `#[ts(as)]`, so
# ts-rs's notes about serde attributes it does not parse are noise.
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings", "uuid-impl"] }
uuid = { version = "=1.27.0", features = ["serde"] }
wide = "=1.7.1"
# Windows system APIs, used only in blurrd-video's `sys` module.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }
# xtask only: unpacking the pinned FFmpeg archive and NuGet packages.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Development only.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic exceptions for video and pixel arithmetic and for API ergonomics.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Discipline. CI runs clippy with `-D warnings`, so these are errors there;
# clippy.toml allows unwrap, expect and printing inside tests.
dbg_macro = "warn"
expect_used = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# The desktop app catches panics on job threads with `catch_unwind` and reports
# them as internal errors, so the shared release profile must unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Release builds of the `blurrd` CLI for distribution: nothing catches panics
# there, so aborting keeps the binary smaller and the failure immediate.
[profile.dist-cli]
inherits = "release"
panic = "abort"

# Keep dependencies (image operations, OCR pre-processing) fast enough to be
# usable in debug builds.
[profile.dev.package."*"]
opt-level = 2

# The synthetic fixture generator renders full frames in every test; keep
# it fast in debug builds too.
[profile.dev.package.blurrd-testkit]
opt-level = 2

# The detectors classify every pixel of their crops; the synthetic
# detector suites run hundreds of frames, so keep them fast in debug
# builds as well.
[profile.dev.package.blurrd-detect]
opt-level = 2
