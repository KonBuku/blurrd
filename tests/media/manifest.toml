# Real recordings used by the local golden tests and benchmarks
# (architecture plan 11.2 and 11.7). The recordings themselves are never
# committed: they contain other players' names and third-party
# copyrighted material. Tests and `cargo xtask media verify` read them
# from the folder in BLURRD_TEST_MEDIA and skip when it is not set.
#
# This file holds only identifiers, file names, SHA-256 checksums, frame
# counts, excerpt frame ranges, case tags and the split: no pixels, no
# names. Frame numbers are presentation-order indices (inclusive ranges).
#
# Held-out clips (`held_out = true`) are never used to tune a detector;
# every gate of plan 11.3 must also pass on them. Their excerpts are
# held out too. The split is fixed: do not move a clip between the sets.
# Soak clips are run in full to measure false positives and long-lived
# tracking.

