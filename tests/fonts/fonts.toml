# Fonts for names in other scripts in the synthetic HUD fixtures
# (blurrd-testkit). They are too large to commit, so
# `cargo xtask fetch-fonts` downloads them from the Google Fonts repository
# at a pinned commit into tests/fonts/noto/ (gitignored) and checks each
# file's SHA-256. All of them are licensed under the SIL Open Font License
# 1.1; each font's license text is fetched next to it. See
# docs/development.md ("Synthetic HUD fixtures").

base_url = "https://raw.githubusercontent.com/google/fonts/5e8a3ba899557829a76cfdac30fa512bda91d7ca"

