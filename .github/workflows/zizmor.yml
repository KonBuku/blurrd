# Static security analysis of the GitHub Actions workflows and the
# Dependabot configuration with zizmor (https://docs.zizmor.sh).
#
# Findings are reported as workflow annotations and fail the job. Uploading
# SARIF to code scanning (`advanced-security: true`) needs GitHub Advanced
# Security on a private repository; switch it on when the repository is
# public and grant the job `security-events: write`.

name: zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
