# Checks the pull request title with commitlint. Pull requests are squash
# merged, so the title becomes the commit header on main and must follow the
# rules in commitlint.config.js (Conventional Commits, scopes, 72 characters).
#
# The workflow uses the `pull_request` trigger, not `pull_request_target`:
# it needs no secrets and only a read-only token, so it is safe to run on
# pull requests from forks. The title reaches the shell through an
# environment variable, never through template expansion.

name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    # Dependabot titles ("build(deps): bump the ... group ...") are generated
    # and can exceed the header length; they are fixed when squashing. The
    # check uses the pull request author, which cannot be spoofed, instead of
    # the actor of the event.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
