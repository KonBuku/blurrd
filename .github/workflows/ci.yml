# Continuous integration: formatting, lints, secret scan, frontend checks,
# Rust tests on Windows, the cargo-deny policy and, on main, the Windows
# installer. Each step lands together with the code it checks; see
# docs/development.md ("Continuous integration").
#
# Every action is pinned to a full commit SHA with its tag as a comment, so
# Dependabot can update both. Tools that are installed by version (nextest,
# cargo-deny, gitleaks) are pinned in the env block below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  CARGO_NEXTEST_VERSION: "0.9.146"
  CARGO_DENY_VERSION: "0.20.2"
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, taken from the
  # checksums file of the gitleaks release.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history, not only the checked-out tree.
          fetch-depth: 0
          persist-credentials: false
      - name: rust toolchain
        # Installs the toolchain, components and targets pinned in
        # rust-toolchain.toml with the rustup that ships on the runner.
        run: rustup toolchain install --no-self-update
      - name: rustfmt
        run: cargo fmt --all --check
      - name: bindings and schema freshness
        # The TypeScript bindings and JSON Schemas are generated from the
        # Rust types and committed; regenerate them and fail on any
        # difference, including new files.
        run: |
          cargo xtask bindings
          cargo xtask schema
          git add --intent-to-add apps/desktop/src/bindings docs/schema
          git diff --exit-code -- apps/desktop/src/bindings docs/schema
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: oxfmt
        run: pnpm exec oxfmt --check
      - name: oxlint
        run: pnpm lint
      - name: typography
        # The desktop frontend uses only the text-ui-* type scale.
        run: pnpm lint:typography
      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - name: gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: unit tests
        run: pnpm test
      - name: vite build
        run: pnpm --filter @blurrd/desktop build
      - name: playwright browser
        # Chromium is the engine of WebView2; the end-to-end tests run the
        # frontend against the mock backend, so no Tauri shell is needed.
        run: pnpm --filter @blurrd/desktop exec playwright install --with-deps chromium
      - name: ffmpeg
        # Encodes the synthetic fixture videos of the preview tests
        # (apps/desktop/scripts/make-fixture-media.mjs).
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: blur reference frames
        # Frames blurred by CpuBlur; the WebGL preview must match them
        # within the documented tolerance (e2e/blur-parity.spec.ts).
        run: cargo run --locked -p blurrd-blur --example reference_frames
      - name: end-to-end tests
        run: pnpm --filter @blurrd/desktop e2e
        env:
          # Fail instead of skipping when the reference frames are missing.
          BLURRD_REQUIRE_BLUR_REFERENCE: "1"
      - name: playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

  screenshots:
    name: screenshots (windows)
    # The component gallery screenshots are rendered with the Windows
    # system font (Segoe UI), so their baselines are compared on Windows;
    # the Linux frontend job skips them.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: playwright browser
        run: pnpm --filter @blurrd/desktop exec playwright install chromium
      - name: gallery screenshots
        run: pnpm --filter @blurrd/desktop e2e --grep "@screenshot"
      - name: playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

  rust:
    name: rust (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # bindgen (ffmpeg-sys-the-third) needs libclang; the runner image
      # ships LLVM in this folder.
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # Installs the toolchain, components and targets pinned in
        # rust-toolchain.toml with the rustup that ships on the runner.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Native dependencies are pinned outside Cargo.lock.
          key: ${{ hashFiles('third_party/*.toml') }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}
      - name: ffmpeg cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('third_party/ffmpeg.toml') }}
      - name: ffmpeg
        # Installs the FFmpeg build pinned in third_party/ffmpeg.toml (headers
        # and import libraries for the bindings) after checking its SHA-256,
        # and copies its DLLs next to the test binaries. The token reads the
        # release while the repository is private.
        run: cargo xtask fetch-ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
      - name: fixture fonts cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fonts/noto
          key: fonts-${{ hashFiles('tests/fonts/fonts.toml') }}
      - name: fixture fonts
        # Noto fonts for the multi-script synthetic HUD fixtures, pinned by
        # SHA-256 in tests/fonts/fonts.toml.
        run: cargo xtask fetch-fonts
      - name: onnx runtime and ocr models cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/ort
            models
          key: ocr-${{ hashFiles('third_party/ort.toml', 'models.toml') }}
      - name: onnx runtime and ocr models
        # The DirectML build of ONNX Runtime from nuget.org and the bundled
        # OCR models, pinned by SHA-256 in third_party/ort.toml and
        # models.toml.
        run: |
          cargo xtask fetch-ort
          cargo xtask fetch-models
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo nextest run --workspace --locked
        env:
          # Fail instead of skipping when the fixture fonts or ONNX Runtime
          # and the OCR models are missing.
          BLURRD_REQUIRE_FONTS: "1"
          BLURRD_REQUIRE_OCR: "1"
      - name: doctests
        run: cargo test --workspace --doc --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # Installs the toolchain, components and targets pinned in
        # rust-toolchain.toml with the rustup that ships on the runner.
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: cargo-deny
        run: cargo deny --locked check advisories bans licenses sources

  bundle:
    name: bundle (windows)
    # Installers are built for main only; pull requests stop at the checks.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [frontend, screenshots, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # Installs the toolchain, components and targets pinned in
        # rust-toolchain.toml with the rustup that ships on the runner.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: tauri build
        # Release build of the app and its NSIS installer (unsigned, D3).
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blurrd-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
