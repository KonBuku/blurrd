# typos configuration, checked with typos 1.51.1.
# https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
extend-exclude = [
  "*.lock",
  "CHANGELOG.md",
  "THIRD-PARTY-NOTICES.md",
  "apps/desktop/src/features/about/licenses.json",
  "pnpm-lock.yaml",
]

# Add false positives (HUD or codec jargon) as `word = "word"`.
[default.extend-words]
# MP4/QuickTime box names (crates/blurrd-video/src/mp4.rs).
trak = "trak"
# OpenType variation axis tag in the fixture font pins (tests/fonts).
wdth = "wdth"
# German chat prefix in the synthetic HUD fixtures.
Alle = "Alle"
# Command-line key of the match-end screen region (plan 5.7).
matchend = "matchend"
# German system chat verb in the OCR name rules (crates/blurrd-engine).
ist = "ist"
# VALORANT agent name in the OCR whitelist (crates/blurrd-ocr).
yoru = "yoru"
# The HTMLMediaElement event fired after a seek (apps/desktop preview).
seeked = "seeked"
