# git-cliff configuration: https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md and the release notes from Conventional Commits.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/KonBuku/blurrd/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
sort_commits = "oldest"
commit_preprocessors = [
  # Turn "(#123)" into a link to the pull request.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/KonBuku/blurrd/pull/${1}))" },
]
# The first matching parser wins. Build, CI, test, style and other chores
# are left out of the changelog, except dependency updates.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = '^build\(deps\)', group = "<!-- 6 -->Dependencies" },
  { message = '^chore\(release\)', skip = true },
  { message = "^(build|chore|ci|style|test)", skip = true },
]

[bump]
features_always_bump_minor = true
# In 0.x a breaking change bumps the minor version.
breaking_always_bump_major = false
initial_tag = "v0.1.0"
