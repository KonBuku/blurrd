# cargo-deny configuration, checked with cargo-deny 0.20.2.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only. No GPL or AGPL crates: FFmpeg is linked
# dynamically as an LGPL build and is not a crate dependency.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# ffmpeg-the-third and ffmpeg-sys-the-third (the FFmpeg bindings) are
# WTFPL, a permissive public-domain-like license. Allowed for those two
# crates only.
[[licenses.exceptions]]
allow = ["WTFPL"]
crate = "ffmpeg-the-third"

[[licenses.exceptions]]
allow = ["WTFPL"]
crate = "ffmpeg-sys-the-third"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
