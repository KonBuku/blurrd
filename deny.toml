# cargo-deny configuration, checked with cargo-deny 0.20.2.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ttf-parser (through ab_glyph) is unmaintained. It is used only by the
  # development-only blurrd-testkit to render synthetic HUD fixtures from
  # the fonts in tests/fonts, which are committed or pinned by SHA-256, so
  # it never parses untrusted input and is never shipped. Revisit when
  # ab_glyph moves to a maintained parser.
  { id = "RUSTSEC-2026-0192", reason = "dev-only fixture rendering of pinned fonts" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only. No GPL or AGPL crates: FFmpeg is linked
# dynamically as an LGPL build and is not a crate dependency.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# ffmpeg-the-third and ffmpeg-sys-the-third (the FFmpeg bindings) are
# WTFPL, a permissive public-domain-like license. Allowed for those two
# crates only.
[[licenses.exceptions]]
allow = ["WTFPL"]
crate = "ffmpeg-the-third"

[[licenses.exceptions]]
allow = ["WTFPL"]
crate = "ffmpeg-sys-the-third"

# jpeg-encoder (thumbnails) is "(MIT OR Apache-2.0) AND IJG": parts are
# derived from the Independent JPEG Group's software, whose permissive
# license asks for an acknowledgement in the documentation of binaries
# (kept in the generated third-party notices). Allowed for this crate only.
[[licenses.exceptions]]
allow = ["IJG"]
crate = "jpeg-encoder"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
